<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontline Arena</title>
    <link rel="stylesheet" href="style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
        }
      }
    </script>
  </head>
  <body>
    <main id="game">
      <div id="crosshair" aria-hidden="true"></div>
      <section id="hud" aria-live="polite">
        <div class="hud-card">
          <span>生命</span>
          <strong id="health">100</strong>
        </div>
        <div class="hud-card">
          <span>武器</span>
          <strong id="weapon">手槍</strong>
        </div>
        <div class="hud-card">
          <span>彈藥</span>
          <strong id="ammo">12 / 12</strong>
        </div>
        <div class="hud-card">
          <span>敵人</span>
          <strong id="enemies">5</strong>
        </div>
      </section>

      <section id="message">
        <h1>FRONTLINE ARENA</h1>
        <p>WASD 移動・滑鼠瞄準・左鍵射擊・1/2 切換武器</p>
        <button id="start-button" type="button">開始遊戲</button>
      </section>

      <div id="hit-marker" aria-hidden="true">×</div>
      <div id="damage-flash" aria-hidden="true"></div>
    </main>
    <script type="module" src="game.js"></script>
  </body>
</html>
